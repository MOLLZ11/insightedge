<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>InsightEdge Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
:root{
  --bg:#0f0b08;
  --bg2:#1a1410;
  --bg3:#221c15;
  --bg4:#2e261c;
  --bg5:#3a3025;
  --border:#3d3225;
  --border2:#5a4a35;
  --amber:#c87941;
  --amber-light:#e09050;
  --amber-pale:#f5b870;
  --amber-bg:rgba(200,121,65,.13);
  --amber-bg2:rgba(200,121,65,.22);
  --red:#e05555;--red-bg:rgba(224,85,85,.13);
  --green:#4caf82;--green-bg:rgba(76,175,130,.13);
  --blue:#5b9bd5;--blue-bg:rgba(91,155,213,.13);
  --text:#ede8e0;--text2:#a89880;--text3:#6b5c48;
  --radius:10px;--radius-lg:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── LOGIN SCREEN ── */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:radial-gradient(ellipse at 50% 0%,#2e1f0e 0%,#0f0b08 65%)}
.login-box{width:100%;max-width:420px}
.login-logo-wrap{text-align:center;margin-bottom:1.75rem}
.login-logo-icon{width:72px;height:72px;background:linear-gradient(145deg,#c87941,#8b4f22);border-radius:18px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem;box-shadow:0 8px 32px rgba(200,121,65,.35)}
.login-logo-icon i{font-size:34px;color:#fff}
.login-title{font-family:'Barlow Condensed',sans-serif;font-size:34px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.login-subtitle{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-top:4px}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:2rem}
.login-welcome{font-size:22px;font-weight:600;margin-bottom:4px}
.login-sub{font-size:14px;color:var(--text2);margin-bottom:1.75rem}
.login-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:6px;margin-top:1.25rem;display:block}
.login-label:first-of-type{margin-top:0}
.login-input{width:100%;padding:12px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border .2s}
.login-input:focus{border-color:var(--amber)}
.login-btn{width:100%;margin-top:1.5rem;padding:13px;background:linear-gradient(135deg,#c87941,#a05c28);color:#fff;font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;border:none;border-radius:var(--radius);cursor:pointer;transition:opacity .2s;letter-spacing:.02em}
.login-btn:hover{opacity:.88}
.login-footer{text-align:center;margin-top:1.25rem;font-size:12px;color:var(--text3)}
.login-footer span{color:var(--amber)}
.login-err{color:var(--red);font-size:13px;margin-top:8px;display:none}

/* ── SETUP SCREEN ── */
#setup-screen{display:none;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:radial-gradient(ellipse at 50% 0%,#2e1f0e 0%,#0f0b08 65%)}
.setup-box{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:580px}
.setup-hd{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.25rem}
.setup-sub{color:var(--text2);font-size:13px;margin-bottom:1.75rem}
.setup-label{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--text2);text-transform:uppercase;margin-bottom:8px;margin-top:1.25rem;display:block}
.setup-label:first-of-type{margin-top:0}
.setup-input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border .2s}
.setup-input:focus{border-color:var(--amber)}
.biz-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.biz-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px}
.biz-card:hover{border-color:var(--border2)}
.biz-card.selected{border-color:var(--amber);background:var(--amber-bg)}
.biz-card i{font-size:20px;color:var(--text2)}
.biz-card.selected i{color:var(--amber-light)}
.biz-card-label{font-size:13px;font-weight:500}
.biz-card-sub{font-size:11px;color:var(--text2);margin-top:1px}
.setup-btn{width:100%;margin-top:1.75rem;padding:12px;background:linear-gradient(135deg,#c87941,#a05c28);color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;border:none;border-radius:var(--radius);cursor:pointer;transition:opacity .2s}
.setup-btn:hover{opacity:.88}

/* ── MAIN APP ── */
#app{display:none;flex-direction:column;min-height:100vh}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.topbar-logo{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.topbar-logo span{color:var(--amber)}
.biz-badge{background:var(--bg4);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.biz-badge i{font-size:14px;color:var(--amber)}
.topbar-right{display:flex;align-items:center;gap:10px}
.client-name{font-size:13px;font-weight:500;color:var(--amber-pale)}
.logout-btn{background:none;border:1px solid var(--border);border-radius:8px;color:var(--text2);padding:5px 10px;cursor:pointer;font-size:12px;font-family:'DM Sans',sans-serif;transition:all .2s}
.logout-btn:hover{border-color:var(--amber);color:var(--amber)}
.main{display:flex;flex:1}
.sidebar{width:200px;background:var(--bg2);border-right:1px solid var(--border);padding:1rem 0;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all .15s;border-left:2px solid transparent}
.nav-item i{font-size:18px}
.nav-item:hover{color:var(--text);background:var(--bg3)}
.nav-item.active{color:var(--amber-light);border-left-color:var(--amber);background:var(--amber-bg)}
.nav-section{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);padding:14px 20px 4px}
.content{flex:1;padding:1.5rem;overflow-y:auto;max-width:1100px}
.page-title{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:1.5rem;color:var(--text)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.5rem}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem}
.metric-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.metric-value{font-size:26px;font-weight:600;color:var(--text)}
.metric-sub{font-size:11px;margin-top:4px;color:var(--text2)}
.metric-sub.up{color:var(--green)}.metric-sub.warn{color:var(--amber)}.metric-sub.down{color:var(--red)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;margin-bottom:1rem}
.card-title{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:1rem;text-transform:uppercase;letter-spacing:.08em}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:10px;color:var(--text3);padding:6px 10px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.07em}
td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.b-red{background:var(--red-bg);color:var(--red)}
.b-amber{background:var(--amber-bg);color:var(--amber-pale)}
.b-green{background:var(--green-bg);color:var(--green)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.field label{font-size:10px;color:var(--text2);display:block;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border .2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber)}
.field select option{background:var(--bg3)}
.btn{padding:8px 18px;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:'DM Sans',sans-serif;transition:all .2s}
.btn:hover{border-color:var(--border2);background:var(--bg4)}
.btn-amber{background:linear-gradient(135deg,#c87941,#a05c28);color:#fff;border-color:transparent}
.btn-amber:hover{opacity:.88;background:linear-gradient(135deg,#c87941,#a05c28)}
.alert-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.alert-item:last-child{border-bottom:none}
.alert-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.ai-red{background:var(--red-bg);color:var(--red)}
.ai-amber{background:var(--amber-bg);color:var(--amber-pale)}
.ai-green{background:var(--green-bg);color:var(--green)}
.alert-title{font-size:13px;font-weight:500}
.alert-sub{font-size:11px;color:var(--text2);margin-top:1px}
.alert-right{margin-left:auto;text-align:right}
.bar-row{margin-bottom:12px}
.bar-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:4px}
.bar-track{height:7px;background:var(--bg4);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.ceo-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:1.5rem}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem}
.kpi-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;font-weight:600}
.kpi-value{font-size:30px;font-weight:600}
.kpi-trend{font-size:12px;margin-top:4px}
.empty{color:var(--text3);font-size:13px;padding:16px 0;text-align:center}
.divider{height:1px;background:var(--border);margin:1rem 0}
@media(max-width:600px){
  .sidebar{display:none}
  .biz-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .ceo-kpi{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- ══════════ LOGIN SCREEN ══════════ -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo-wrap">
      <div class="login-logo-icon"><i class="ti ti-chart-bar" aria-hidden="true"></i></div>
      <div class="login-title">InsightEdge Analytics</div>
      <div class="login-subtitle">Secure Business Platform</div>
    </div>
    <div class="login-card">
      <div class="login-welcome">Welcome back</div>
      <div class="login-sub">Sign in to your secure dashboard</div>
      <label class="login-label">Username</label>
      <input class="login-input" id="login-user" value="admin" placeholder="Username"/>
      <label class="login-label">Password</label>
      <input class="login-input" id="login-pass" type="password" placeholder="Enter password"/>
      <div class="login-err" id="login-err">Incorrect username or password.</div>
      <button class="login-btn" onclick="doLogin()">Sign In →</button>
    </div>
    <div class="login-footer">
      🔒 Credentials provided by InsightEdge Analytics<br/>
      Contact: 📷 <span>@mollz021</span>
    </div>
  </div>
</div>

<!-- ══════════ SETUP SCREEN ══════════ -->
<div id="setup-screen">
  <div class="setup-box">
    <div class="setup-hd">New Client Setup</div>
    <div class="setup-sub">Tell us about your business to personalise your dashboard</div>

    <label class="setup-label">Your Name / Business Name</label>
    <input class="setup-input" id="client-name" placeholder="e.g. John Pharmacy, Acme Supermarket…"/>

    <label class="setup-label">Select Your Business Type</label>
    <div class="biz-grid" id="biz-grid"></div>

    <button class="setup-btn" onclick="launchApp()">Launch My Dashboard →</button>
  </div>
</div>

<!-- ══════════ MAIN APP ══════════ -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">Insight<span>Edge</span></div>
    <div class="biz-badge"><i class="ti ti-building" aria-hidden="true"></i><span id="topbar-biz-type">Business</span></div>
    <div class="topbar-right">
      <span class="client-name" id="topbar-name"></span>
      <button class="logout-btn" onclick="logout()"><i class="ti ti-logout"></i> Sign Out</button>
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
const ADMIN_USER = 'admin';
const ADMIN_PASS = 'insightedge2024';

function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err');
  if (u === ADMIN_USER && p === ADMIN_PASS) {
    err.style.display = 'none';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('setup-screen').style.display = 'flex';
  } else {
    err.style.display = 'block';
  }
}
document.getElementById('login-pass') && document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

const BIZ_TYPES = [
  { id:'pharmacy',    label:'Pharmacy',      sub:'Drug expiry & restocks',    icon:'ti-pill',                features:['dashboard','inventory','sales','expenses','staff','ceo'] },
  { id:'supermarket', label:'Supermarket',   sub:'Stock, sales & expiry',     icon:'ti-shopping-cart',       features:['dashboard','inventory','sales','expenses','staff','ceo'] },
  { id:'maintenance', label:'Maintenance',   sub:'Jobs, parts & billing',     icon:'ti-tools',               features:['dashboard','jobs','expenses','staff','ceo'] },
  { id:'security',    label:'Security',      sub:'Contracts & patrol logs',   icon:'ti-shield-check',        features:['dashboard','contracts','staff','expenses','ceo'] },
  { id:'bar',         label:'Bar / Lounge',  sub:'Drinks, tabs & stock',      icon:'ti-glass-full',          features:['dashboard','inventory','sales','expenses','staff','ceo'] },
  { id:'petty_trader',label:'Petty Trader',  sub:'Simple sales & stock',      icon:'ti-basket',              features:['dashboard','inventory','sales','expenses','ceo'] },
  { id:'logistics',   label:'Logistics',     sub:'Trips, fleet & billing',    icon:'ti-truck',               features:['dashboard','trips','expenses','staff','ceo'] },
  { id:'restaurant',  label:'Restaurant',    sub:'Menu, orders & stock',      icon:'ti-chef-hat',            features:['dashboard','inventory','sales','expenses','staff','ceo'] },
  { id:'salon',       label:'Salon / Spa',   sub:'Appointments & services',   icon:'ti-scissors',            features:['dashboard','appointments','sales','expenses','staff','ceo'] },
  { id:'wholesale',   label:'Wholesale',     sub:'Bulk stock & orders',       icon:'ti-building-warehouse',  features:['dashboard','inventory','sales','expenses','staff','ceo'] },
];

const NAV_META = {
  dashboard:    { label:'Dashboard',     icon:'ti-layout-dashboard' },
  inventory:    { label:'Inventory',     icon:'ti-package' },
  sales:        { label:'Sales',         icon:'ti-receipt' },
  jobs:         { label:'Jobs',          icon:'ti-clipboard-list' },
  contracts:    { label:'Contracts',     icon:'ti-file-text' },
  trips:        { label:'Trips',         icon:'ti-route' },
  appointments: { label:'Appointments', icon:'ti-calendar-event' },
  expenses:     { label:'Expenses',      icon:'ti-wallet' },
  staff:        { label:'Staff',         icon:'ti-users' },
  ceo:          { label:'CEO Report',    icon:'ti-chart-bar' },
};

let state = { client:null, bizType:null, products:[], sales:[], expenses:[], staff:[], jobs:[], contracts:[], trips:[], appointments:[], currentPage:'dashboard' };

const todayStr = () => new Date().toISOString().split('T')[0];
const daysUntil = d => Math.ceil((new Date(d) - new Date()) / 86400000);
const fmt = n => '$' + (n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');

// Build biz grid
const grid = document.getElementById('biz-grid');
let selectedBiz = null;
BIZ_TYPES.forEach(b => {
  const el = document.createElement('div');
  el.className = 'biz-card';
  el.innerHTML = `<i class="ti ${b.icon}" aria-hidden="true"></i><div><div class="biz-card-label">${b.label}</div><div class="biz-card-sub">${b.sub}</div></div>`;
  el.onclick = () => { document.querySelectorAll('.biz-card').forEach(c=>c.classList.remove('selected')); el.classList.add('selected'); selectedBiz=b.id; };
  grid.appendChild(el);
});

function launchApp() {
  const name = document.getElementById('client-name').value.trim();
  if (!name) { alert('Please enter your name or business name.'); return; }
  if (!selectedBiz) { alert('Please select a business type.'); return; }
  state.client = name;
  state.bizType = BIZ_TYPES.find(b=>b.id===selectedBiz);
  loadSampleData();
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('topbar-name').textContent = name;
  document.getElementById('topbar-biz-type').textContent = state.bizType.label;
  buildSidebar();
  showPage('dashboard');
}

function logout() {
  selectedBiz=null;
  document.querySelectorAll('.biz-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('client-name').value='';
  document.getElementById('login-pass').value='';
  state={client:null,bizType:null,products:[],sales:[],expenses:[],staff:[],jobs:[],contracts:[],trips:[],appointments:[],currentPage:'dashboard'};
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
}

function addDays(d,n){const dt=new Date(d);dt.setDate(dt.getDate()+n);return dt.toISOString().split('T')[0];}

function loadSampleData(){
  const b=state.bizType.id;
  if(['pharmacy','supermarket','bar','restaurant','petty_trader','wholesale'].includes(b)){
    state.products=[
      {id:1,name:'Product A',category:'Category 1',qty:45,expiry:addDays(todayStr(),20),restock:20,price:12.50},
      {id:2,name:'Product B',category:'Category 1',qty:8,expiry:addDays(todayStr(),90),restock:30,price:5.00},
      {id:3,name:'Product C',category:'Category 2',qty:120,expiry:addDays(todayStr(),400),restock:25,price:8.75},
      {id:4,name:'Product D',category:'Category 2',qty:5,expiry:addDays(todayStr(),5),restock:15,price:15.00},
    ];
    state.sales=[
      {id:1,productId:1,qty:10,date:addDays(todayStr(),-5),revenue:125},
      {id:2,productId:3,qty:5,date:addDays(todayStr(),-3),revenue:43.75},
      {id:3,productId:2,qty:8,date:addDays(todayStr(),-1),revenue:40},
    ];
  }
  if(b==='maintenance'){state.jobs=[{id:1,client:'Apex Ltd',desc:'AC Repair',status:'In Progress',amount:350,date:todayStr()},{id:2,client:'Metro Office',desc:'Plumbing Fix',status:'Completed',amount:180,date:addDays(todayStr(),-2)}];}
  if(b==='security'){state.contracts=[{id:1,client:'BlueStar Bank',site:'Main Branch',start:todayStr(),end:addDays(todayStr(),180),monthly:1200,status:'Active'},{id:2,client:'City Mall',site:'Parking Zone',start:todayStr(),end:addDays(todayStr(),25),monthly:800,status:'Active'}];}
  if(b==='logistics'){state.trips=[{id:1,driver:'Samuel K.',route:'Lagos → Abuja',cargo:'Electronics',status:'En Route',amount:550,date:todayStr()},{id:2,driver:'Emeka O.',route:'PH → Lagos',cargo:'FMCG Goods',status:'Delivered',amount:420,date:addDays(todayStr(),-1)}];}
  if(b==='salon'){state.appointments=[{id:1,client:'Ada N.',service:'Hair Styling',staff:'Grace',date:todayStr(),time:'10:00',amount:80,status:'Confirmed'},{id:2,client:'Bola F.',service:'Manicure',staff:'Joy',date:todayStr(),time:'14:00',amount:35,status:'Confirmed'}];}
  state.expenses=[{id:1,desc:'Staff Salary',category:'Salaries',amount:1200,date:addDays(todayStr(),-10)},{id:2,desc:'Utilities',category:'Overhead',amount:320,date:addDays(todayStr(),-5)}];
  state.staff=[{id:1,name:'Alice M.',role:'Manager',phone:'080-0000-001',status:'Active'},{id:2,name:'Bob T.',role:'Staff',phone:'080-0000-002',status:'Active'}];
}

function buildSidebar(){
  const sb=document.getElementById('sidebar');
  sb.innerHTML='<div class="nav-section">Menu</div>';
  state.bizType.features.forEach(f=>{
    const m=NAV_META[f];
    const el=document.createElement('div');
    el.className='nav-item'+(f===state.currentPage?' active':'');
    el.id='nav-'+f;
    el.innerHTML=`<i class="ti ${m.icon}" aria-hidden="true"></i>${m.label}`;
    el.onclick=()=>showPage(f);
    sb.appendChild(el);
  });
}

function showPage(page){
  state.currentPage=page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const navEl=document.getElementById('nav-'+page);
  if(navEl)navEl.classList.add('active');
  const content=document.getElementById('content');
  content.innerHTML='';
  const pages={dashboard,inventory,sales,jobs,contracts,trips,appointments,expenses,staff,ceo};
  if(pages[page])pages[page](content);
}

// ── DASHBOARD ──
function dashboard(el){
  const b=state.bizType.id;
  const totalSales=state.sales.reduce((a,s)=>a+s.revenue,0);
  const totalExp=state.expenses.reduce((a,e)=>a+e.amount,0);
  const expiringItems=state.products.filter(p=>{const d=daysUntil(p.expiry);return d>0&&d<=30;});
  const expiredItems=state.products.filter(p=>daysUntil(p.expiry)<=0);
  const lowStock=state.products.filter(p=>p.qty<=p.restock&&daysUntil(p.expiry)>0);
  const activeStaff=state.staff.filter(s=>s.status==='Active').length;
  let metricsHtml='';
  if(['pharmacy','supermarket','bar','restaurant','petty_trader','wholesale'].includes(b)){
    metricsHtml+=mc('Revenue',fmt(totalSales),'↑ this month','up');
    metricsHtml+=mc('Expiring Soon',expiringItems.length+expiredItems.length,'items need attention',expiredItems.length>0?'down':'warn');
    metricsHtml+=mc('Low Stock',lowStock.length,'items to restock',lowStock.length>0?'warn':'');
  }
  if(b==='maintenance'){const e=state.jobs.filter(j=>j.status==='Completed').reduce((a,j)=>a+j.amount,0);metricsHtml+=mc('Jobs Earned',fmt(e),'completed','up');metricsHtml+=mc('Active Jobs',state.jobs.filter(j=>j.status==='In Progress').length,'in progress','warn');}
  if(b==='security'){const m=state.contracts.filter(c=>daysUntil(c.end)>0).reduce((a,c)=>a+c.monthly,0);metricsHtml+=mc('Monthly Revenue',fmt(m),'active contracts','up');metricsHtml+=mc('Expiring Contracts',state.contracts.filter(c=>daysUntil(c.end)<=30&&daysUntil(c.end)>0).length,'within 30 days','warn');}
  if(b==='logistics'){const e=state.trips.filter(t=>t.status==='Delivered').reduce((a,t)=>a+t.amount,0);metricsHtml+=mc('Trips Earned',fmt(e),'from deliveries','up');metricsHtml+=mc('Active Trips',state.trips.filter(t=>t.status==='En Route').length,'on the road','warn');}
  if(b==='salon'){metricsHtml+=mc('Revenue',fmt(totalSales),'↑ this month','up');metricsHtml+=mc("Today's Bookings",state.appointments.filter(a=>a.date===todayStr()).length,'appointments','up');}
  metricsHtml+=mc('Expenses',fmt(totalExp),'total recorded','');
  if(state.bizType.features.includes('staff'))metricsHtml+=mc('Active Staff',activeStaff,'team members','up');
  let alertsHtml='';
  expiredItems.forEach(p=>{alertsHtml+=ai('ai-red','ti-alert-circle',p.name,'Expired — remove from stock','<span class="badge b-red">Expired</span>');});
  expiringItems.forEach(p=>{alertsHtml+=ai('ai-amber','ti-clock',p.name,`${p.category} · ${p.qty} units · expires in ${daysUntil(p.expiry)} days`,`<span class="badge b-amber">${daysUntil(p.expiry)}d left</span>`);});
  lowStock.forEach(p=>{alertsHtml+=ai('ai-amber','ti-package',p.name+' — Low Stock',`${p.qty} remaining / threshold ${p.restock}`,'<span class="badge b-amber">Restock</span>');});
  state.contracts&&state.contracts.filter(c=>daysUntil(c.end)<=30&&daysUntil(c.end)>0).forEach(c=>{alertsHtml+=ai('ai-amber','ti-file-text',c.client+' contract expiring',`${c.site} · ${daysUntil(c.end)} days left`,`<span class="badge b-amber">${daysUntil(c.end)}d</span>`);});
  if(!alertsHtml)alertsHtml='<div class="empty"><i class="ti ti-circle-check" style="color:var(--green)"></i> All clear — no critical alerts</div>';
  el.innerHTML=`<div class="page-title">Dashboard</div><div class="metrics">${metricsHtml}</div><div class="card"><div class="card-title">Critical Alerts</div>${alertsHtml}</div>`;
}
function mc(label,value,sub,subCls){return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-sub ${subCls||''}">${sub}</div></div>`;}
function ai(iconCls,icon,title,sub,right){return `<div class="alert-item"><div class="alert-icon ${iconCls}"><i class="ti ${icon}" aria-hidden="true"></i></div><div><div class="alert-title">${title}</div><div class="alert-sub">${sub}</div></div><div class="alert-right">${right}</div></div>`;}

// ── CEO REPORT ──
function ceo(el){
  const b=state.bizType.id;
  const totalSales=state.sales.reduce((a,s)=>a+s.revenue,0);
  const totalExp=state.expenses.reduce((a,e)=>a+e.amount,0);
  const profit=totalSales-totalExp;
  const activeStaff=state.staff.filter(s=>s.status==='Active').length;
  let kpiHtml=kpi('Total Revenue',fmt(totalSales),'↑ all time','up')+kpi('Total Expenses',fmt(totalExp),'recorded costs','')+kpi('Net Profit',fmt(profit),profit>=0?'Positive':'Loss',profit>=0?'up':'down');
  if(state.bizType.features.includes('staff'))kpiHtml+=kpi('Active Staff',activeStaff,'team members','up');
  const catMap={};state.expenses.forEach(e=>{catMap[e.category]=(catMap[e.category]||0)+e.amount;});
  const maxCat=Math.max(...Object.values(catMap),1);
  const colors=['#c87941','#4caf82','#5b9bd5','#9f7aea','#e05555','#e09050'];
  const barsHtml=Object.entries(catMap).map(([cat,amt],i)=>`<div class="bar-row"><div class="bar-meta"><span>${cat}</span><span>${fmt(amt)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(amt/maxCat*100)}%;background:${colors[i%colors.length]}"></div></div></div>`).join('')||'<div class="empty">No expense data</div>';
  const topRows=[...state.sales].sort((a,b)=>b.revenue-a.revenue).slice(0,5).map(s=>{const p=state.products.find(x=>x.id===s.productId)||{name:'Unknown'};return `<tr><td>${p.name}</td><td>${s.qty}</td><td>${fmt(s.revenue)}</td><td>${s.date}</td></tr>`;}).join('')||`<tr><td colspan="4" class="empty">No sales data</td></tr>`;
  let special='';
  if(b==='maintenance'){const c=state.jobs.filter(j=>j.status==='Completed');special=`<div class="card"><div class="card-title">Jobs Summary</div><div style="display:flex;gap:1.5rem;flex-wrap:wrap"><div><div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.07em">Completed</div><div style="font-size:26px;font-weight:600">${c.length}</div></div><div><div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.07em">Earned</div><div style="font-size:26px;font-weight:600;color:var(--amber)">${fmt(c.reduce((a,j)=>a+j.amount,0))}</div></div></div></div>`;}
  if(b==='logistics'){const d=state.trips.filter(t=>t.status==='Delivered');special=`<div class="card"><div class="card-title">Trips Summary</div><div style="display:flex;gap:1.5rem;flex-wrap:wrap"><div><div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.07em">Delivered</div><div style="font-size:26px;font-weight:600">${d.length}</div></div><div><div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.07em">Revenue</div><div style="font-size:26px;font-weight:600;color:var(--amber)">${fmt(d.reduce((a,t)=>a+t.amount,0))}</div></div></div></div>`;}
  if(b==='security'){const a=state.contracts.filter(c=>daysUntil(c.end)>0);special=`<div class="card"><div class="card-title">Contract Summary</div><div style="display:flex;gap:1.5rem;flex-wrap:wrap"><div><div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.07em">Active</div><div style="font-size:26px;font-weight:600">${a.length}</div></div><div><div style="font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.07em">Monthly</div><div style="font-size:26px;font-weight:600;color:var(--amber)">${fmt(a.reduce((s,c)=>s+c.monthly,0))}</div></div></div></div>`;}
  el.innerHTML=`<div class="page-title">CEO Report — ${state.client}</div><div class="ceo-kpi">${kpiHtml}</div>${special}<div class="card"><div class="card-title">Expenses by Category</div>${barsHtml}</div><div class="card"><div class="card-title">Top Sales</div><table><thead><tr><th>Product</th><th>Qty</th><th>Revenue</th><th>Date</th></tr></thead><tbody>${topRows}</tbody></table></div>`;
}
function kpi(label,value,trend,cls){return `<div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-trend ${cls==='up'?'up':cls==='down'?'down':''}">${trend}</div></div>`;}
</script>
</body>
</html>
